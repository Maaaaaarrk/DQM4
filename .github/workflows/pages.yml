name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /DQM4/
          VITE_AUTH_ENABLED: "false"

      - name: SPA fallback
        run: |
          site="dist/client"
          if [ ! -f "$site/index.html" ]; then
            echo "expected $site/index.html" >&2
            find dist .output -name 'index.html' -o -name '_shell.html' | head
            exit 1
          fi
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
